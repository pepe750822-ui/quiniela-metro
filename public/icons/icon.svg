  <polygon points="152,68 172,80 172,104 152,116 132,104 132,80" fill="#1a1a1a" opacity="0.6"/>
  <polygon points="40,124 60,112 76,124 76,148 56,160 36,148" fill="#1a1a1a" opacity="0.4"/>

